<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RUNE</title>
<link rel="canonical" href="https://runecapital.co/">
<meta property="og:url" content="https://runecapital.co/">
<meta property="og:title" content="RUNE">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<meta name="theme-color" content="#F8F7F3">
<link rel="preload" href="assets/fonts/oswald-var.woff2?v=22c3b00d" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="assets/fonts/archivo-var.woff2?v=de2f1fe8" as="font" type="font/woff2" crossorigin>
<style>
  /* Oswald and Archivo: SIL Open Font License 1.1 */
  @font-face {
    font-family: 'Oswald';
    src: url('assets/fonts/oswald-var.woff2?v=22c3b00d') format('woff2');
    font-weight: 200 700;
    font-display: swap;
  }
  @font-face {
    font-family: 'Archivo';
    src: url('assets/fonts/archivo-var.woff2?v=de2f1fe8') format('woff2');
    font-weight: 100 900;
    font-stretch: 62% 125%;
    font-display: swap;
  }
  html, body { margin: 0; padding: 0; background: #F8F7F3; }
  body {
    display: flex;
    flex-direction: column;
    min-height: 100vh;
    min-height: 100svh;
  }
  .hero {
    position: relative;
    flex: 1 1 auto;
    width: 100%;
    min-height: 480px;
    overflow: hidden;
    background-color: #F8F7F3;
  }
  .hero img,
  .hero canvas {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    display: block;
  }
  .hero img { object-fit: cover; object-position: 47% 50%; }
  .hero canvas { opacity: 0; transition: opacity 500ms ease; touch-action: pan-y; }
  .mark {
    position: absolute;
    top: clamp(26px, 4.6vh, 60px);
    left: 0;
    right: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: clamp(6px, 1.1vh, 14px);
    text-align: center;
    pointer-events: none;
    color: #1B4A8C;
  }
  .mark h1 {
    margin: 0;
    font-family: 'Oswald', 'Arial Narrow', sans-serif;
    font-weight: 300;
    font-size: min(17.5vh, 38vw, 200px);
    line-height: 0.86;
    letter-spacing: 0.005em;
  }
  .mark p {
    margin: 0;
    font-family: 'Archivo', 'Arial', sans-serif;
    font-weight: 700;
    font-stretch: 125%;
    font-size: clamp(11px, 1vw, 14px);
    line-height: 1;
    letter-spacing: 0.04em;
    text-transform: uppercase;
  }
  .legal {
    flex: 0 0 auto;
    margin: 0;
    padding: 14px 24px 15px;
    border-top: 1px solid rgba(27, 74, 140, 0.28);
    background: #F8F7F3;
    color: #1B4A8C;
    font-family: 'Archivo', 'Arial', sans-serif;
    font-weight: 600;
    font-stretch: 125%;
    font-size: 10.5px;
    line-height: 1.5;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    text-align: center;
  }
  .legal .sep { margin: 0 0.9em; opacity: 0.45; }
  @media (max-width: 640px) {
    .legal { padding: 12px 16px 14px; font-size: 9.5px; }
    .legal span:not(.sep) { display: block; }
    .legal .sep { display: none; }
  }
</style>
</head>
<body>
<main class="hero">
  <img id="rune-image" src="assets/rune-engraving.jpg?v=3dc38351" alt="Blue line engraving of a stone harbour town with a bell tower, mountains behind and boats on still water">
  <img id="rune-mask" src="assets/rune-engraving-mask.png?v=726fbdf1" alt="" aria-hidden="true" style="display:none">
  <canvas id="rune-canvas" aria-hidden="true"></canvas>
  <div class="mark">
    <h1>RUNE</h1>
    <p>Capital</p>
  </div>
</main>
<footer class="legal">
  <span>&copy; 2026 Rune Capital, LLC</span><span class="sep" aria-hidden="true">|</span><span>All Rights Reserved</span><span class="sep" aria-hidden="true">|</span><span>West 16th Street, New York, NY, 10011</span>
</footer>
<script src="assets/engraving-scene.js?v=03eb15b5"></script>
<script>
  new EngravingScene({
    canvas: document.getElementById('rune-canvas'),
    image: document.getElementById('rune-image'),
    mask: document.getElementById('rune-mask'),
    focusX: 0.47,
    ink: '#1B4A8C',
    paper: '#F8F7F3'
  });
</script>
</body>
</html>
