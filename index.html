<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RUNE — Financial Services for the Compute Age</title>
<meta name="description" content="RUNE. Financial Services for the Compute Age.">
<link rel="canonical" href="https://runecapital.co/">
<meta property="og:url" content="https://runecapital.co/">
<meta property="og:title" content="RUNE">
<meta property="og:description" content="Financial Services for the Compute Age">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<meta name="theme-color" content="#5E8FD0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Tinos:wght@400;700&display=swap">
<style>
  html, body { margin: 0; padding: 0; background: #0D1424; }
  .hero {
    position: relative;
    width: 100%;
    height: 100vh;
    height: 100svh;
    min-height: 560px;
    overflow: hidden;
    background-color: #5E8FD0;
  }
  .hero img,
  .hero canvas {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    display: block;
  }
  .hero img { object-fit: cover; }
  .hero canvas { opacity: 0; touch-action: pan-y; }
  .copy {
    position: absolute;
    left: 0;
    right: 0;
    bottom: 0;
    box-sizing: border-box;
    padding: 0 24px clamp(64px, 11vh, 120px);
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: clamp(6px, 1.4vh, 16px);
    text-align: center;
    pointer-events: none;
  }
  .copy h1,
  .copy p,
  .manifesto-link {
    margin: 0;
    font-family: Tinos, 'Times New Roman', Times, serif;
    font-weight: 400;
    letter-spacing: 0;
    color: #0B1431;
  }
  .copy h1 { font-size: clamp(104px, 17vw, 248px); line-height: 0.9; }
  .copy p { max-width: 28em; font-size: clamp(15px, 5.2vw, 40px); line-height: 1.15; }
  .manifesto-link {
    position: absolute;
    left: 50%;
    bottom: clamp(18px, 3.4vh, 34px);
    transform: translateX(-50%);
    padding: 6px 10px;
    font-size: clamp(17px, 1.6vw, 22px);
    line-height: 1.2;
    text-decoration: none;
    text-decoration-color: #0B1431;
    text-decoration-thickness: 2px;
    text-underline-offset: 6px;
  }
  .manifesto-link:hover,
  .manifesto-link:focus-visible { text-decoration-line: underline; }
  .manifesto-link:focus-visible { outline: 2px solid #0B1431; outline-offset: 2px; }
</style>
</head>
<body>
<main class="hero">
  <img id="rune-image" src="assets/rune-hero.jpg" alt="Dithered landscape of classical temples beside a still lake under a towering cloud">
  <canvas id="rune-canvas" aria-hidden="true"></canvas>
  <div class="copy">
    <h1 id="rune-title">RUNE</h1>
    <p id="rune-tagline">Financial Services for the Compute Age</p>
  </div>
  <a class="manifesto-link" id="rune-manifesto" href="manifesto/">Manifesto</a>
</main>
<script src="assets/rune-scene.js"></script>
<script>
  new RuneScene({
    canvas: document.getElementById('rune-canvas'),
    image: document.getElementById('rune-image'),
    textEls: [
      { el: document.getElementById('rune-title'), target: 40 },
      { el: document.getElementById('rune-tagline'), target: 20 },
      { el: document.getElementById('rune-manifesto'), target: 18 }
    ],
    textColor: '#0B1431',
    shadowColor: '#FFECDC',
    warp: 1,
    glyphSize: 1.5,
    framing: 'landing'
  });
</script>
</body>
</html>
